<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - SomaliTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; font-family: Verdana, Geneva, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #fff; border-bottom: 4px solid #ff6a00; height: 72px; display: flex; align-items: center; padding: 0 16px; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #logo { font-size: 26px; font-weight: 900; color: #111; text-decoration: none; font-family: Impact, fantasy; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
    #logo span { color: #ff6a00; }
    #search-wrap { display: flex; flex: 1; max-width: 400px; margin: 0 auto; }
    #search-input { flex: 1; height: 34px; background: #fff; border: 1px solid #ccc; border-right: none; color: #111; font-size: 13px; font-family: Verdana, sans-serif; padding: 0 10px; outline: none; }
    #search-input:focus { border-color: #ff6a00; }
    #search-btn { width: 70px; height: 34px; background: #ff6a00; border: 1px solid #cc5500; color: #fff; font-size: 12px; font-weight: bold; font-family: Verdana, sans-serif; cursor: pointer; }
    .topbar-btn { height: 34px; padding: 0 14px; font-size: 12px; font-weight: bold; font-family: Verdana, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; white-space: nowrap; }
    .topbar-btn.outline { background: #fff; color: #ff6a00; }
    .topbar-btn.fill { background: #ff6a00; color: #fff; }
    .topbar-btn.fill:hover { background: #e05a00; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .auth-btn { height: 44px; padding: 0 32px; font-size: 13px; font-weight: bold; font-family: Verdana, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; }
    #btn-login { background: #fff; color: #ff6a00; }
    #btn-login:hover { background: #fff3ec; }
    #btn-signup { background: #ff6a00; color: #fff; }
    #btn-signup:hover { background: #e05a00; }
    main { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 32px 16px; }
    .profile-header { background: #fff; border: 1px solid #ddd; padding: 28px; display: flex; align-items: center; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
    .pfp-placeholder { width: 90px; height: 90px; border: 3px solid #ff6a00; background: #ff6a00; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: #fff; font-family: Impact, fantasy; flex-shrink: 0; }
    .profile-info h2 { font-size: 22px; font-family: Impact, fantasy; text-transform: uppercase; letter-spacing: 1px; color: #111; }
    .profile-info p { font-size: 12px; color: #888; margin-top: 4px; }
    .profile-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .sub-btn { height: 36px; padding: 0 20px; font-size: 12px; font-weight: bold; font-family: Verdana, sans-serif; cursor: pointer; border: 2px solid #ff6a00; background: #ff6a00; color: #fff; }
    .sub-btn.subscribed { background: #fff; color: #ff6a00; }
    .sub-btn:hover { background: #e05a00; color: #fff; }
    .sub-count { font-size: 12px; color: #888; font-family: Verdana, sans-serif; }
    .rating-wrap { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .rate-btn { height: 34px; padding: 0 16px; font-size: 13px; cursor: pointer; border: 2px solid #ddd; background: #fff; font-family: Verdana, sans-serif; display: flex; align-items: center; gap: 6px; }
    .rate-btn:hover { border-color: #ff6a00; }
    .rate-btn.active-like { background: #ff6a00; color: #fff; border-color: #ff6a00; }
    .rate-btn.active-dislike { background: #333; color: #fff; border-color: #333; }
    .rating-score { font-size: 12px; color: #888; font-family: Verdana, sans-serif; }
    .rating-bar-wrap { height: 6px; background: #eee; width: 150px; margin-left: 4px; }
    .rating-bar { height: 6px; background: #ff6a00; width: 0%; }
    .section-label { font-size: 11px; font-weight: bold; color: #ff6a00; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    .empty { font-size: 12px; color: #aaa; padding: 20px 0; }
    footer { background: #fff; border-top: 4px solid #ff6a00; padding: 14px 20px; font-size: 11px; color: #aaa; font-family: Verdana, sans-serif; }
    footer a { color: #ff6a00; text-decoration: none; }
  </style>
</head>
<body>
<div id="topbar">
  <a href="index.html" id="logo">Somali<span>Tube</span></a>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="Search" />
    <button id="search-btn">Search</button>
  </div>
  <a href="channels.html" class="topbar-btn outline">All Channels</a>
  <div id="upload-btn-wrap"></div>
  <div id="auth-area">
    <a href="login.html" class="auth-btn" id="btn-login">Log In</a>
    <a href="signup.html" class="auth-btn" id="btn-signup">Sign Up</a>
  </div>
</div>
<main>
  <div id="profile-wrap">Loading...</div>
  <div id="videos-section" style="display:none; margin-top:20px;">
    <div class="section-label">Videos</div>
    <div id="videos-wrap" class="empty">This user has no videos yet.</div>
  </div>
</main>
<footer>
  <span>&copy; 2025 SomaliTube.</span>
  <span>|</span>
  <span>Contact: <a href="mailto:arneper606@gmail.com">arneper606@gmail.com</a></span>
</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw",
    authDomain: "somalitube98.firebaseapp.com",
    projectId: "somalitube98",
    storageBucket: "somalitube98.firebasestorage.app",
    messagingSenderId: "301195499282",
    appId: "1:301195499282:web:b89255bba0f5ed1eba05cb"
  });
  var auth = firebase.auth();
  var db = firebase.firestore();
  var currentUser = null;
  var profileUid = new URLSearchParams(window.location.search).get('uid');

  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    var authArea = document.getElementById('auth-area');
    var uploadWrap = document.getElementById('upload-btn-wrap');
    if (user) {
      var initial = (user.displayName || '?')[0].toUpperCase();
      authArea.innerHTML = '<a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#111;"><div style="width:40px;height:40px;background:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;font-family:Impact,fantasy;">' + initial + '</div><span style="font-size:13px;font-weight:bold;font-family:Verdana,sans-serif;">' + (user.displayName || 'Profile') + '</span></a>';
      uploadWrap.innerHTML = '<a href="https://docs.google.com/forms/d/e/1FAIpQLSesVkUCUFMIIiHSAhhaGc3zPu1Fk8IJroeHty4TWqTGf13wog/viewform?usp=header" target="_blank" class="topbar-btn fill">Upload Video</a>';
    }
    loadProfile();
  });

  function loadProfile() {
    var wrap = document.getElementById('profile-wrap');
    if (!profileUid) { wrap.innerHTML = '<p style="color:#888;font-size:13px;">No user specified.</p>'; return; }

    db.collection('users').doc(profileUid).get().then(function(doc) {
      if (!doc.exists) { wrap.innerHTML = '<p style="color:#888;">User not found.</p>'; return; }
      var data = doc.data();
      var initial = (data.username || '?')[0].toUpperCase();

      // Get sub count
      db.collection('users').doc(profileUid).collection('subscribers').get().then(function(subSnap) {
        var subCount = subSnap.size;
        var isSubbed = currentUser ? subSnap.docs.some(function(d){ return d.id === currentUser.uid; }) : false;

        // Get likes/dislikes
        db.collection('users').doc(profileUid).collection('ratings').get().then(function(ratingSnap) {
          var likes = 0, dislikes = 0, myVote = null;
          ratingSnap.forEach(function(d) {
            if (d.data().vote === 'like') likes++;
            else dislikes++;
            if (currentUser && d.id === currentUser.uid) myVote = d.data().vote;
          });
          var total = likes + dislikes;
          var likePercent = total > 0 ? Math.round((likes / total) * 100) : 0;

          var subBtnHTML = currentUser
            ? '<button class="sub-btn ' + (isSubbed ? 'subscribed' : '') + '" id="sub-btn">' + (isSubbed ? 'Subscribed' : 'Subscribe') + '</button>'
            : '<a href="login.html" class="sub-btn">Subscribe</a>';

          var ratingHTML = currentUser
            ? '<div class="rating-wrap"><button class="rate-btn ' + (myVote==='like'?'active-like':'') + '" id="like-btn">👍 ' + likes + '</button><button class="rate-btn ' + (myVote==='dislike'?'active-dislike':'') + '" id="dislike-btn">👎 ' + dislikes + '</button><div class="rating-bar-wrap"><div class="rating-bar" style="width:' + likePercent + '%"></div></div><span class="rating-score">' + likePercent + '% liked</span></div>'
            : '<div class="rating-wrap"><span style="font-size:11px;color:#aaa;"><a href="login.html" style="color:#ff6a00;">Log in</a> to rate</span></div>';

          wrap.innerHTML =
            '<div class="profile-header">' +
              '<div class="pfp-placeholder">' + initial + '</div>' +
              '<div class="profile-info">' +
                '<h2>' + (data.username || 'Unknown') + '</h2>' +
                '<p>' + subCount + ' subscriber' + (subCount !== 1 ? 's' : '') + '</p>' +
                '<div class="profile-actions">' + subBtnHTML + '</div>' +
                ratingHTML +
              '</div>' +
            '</div>';

          document.getElementById('videos-section').style.display = 'block';

          // Subscribe button
          var subBtn = document.getElementById('sub-btn');
          if (subBtn) {
            subBtn.addEventListener('click', function() {
              if (!currentUser) return;
              var subRef = db.collection('users').doc(profileUid).collection('subscribers').doc(currentUser.uid);
              if (isSubbed) {
                subRef.delete().then(function() { isSubbed = false; loadProfile(); });
              } else {
                subRef.set({ uid: currentUser.uid }).then(function() { isSubbed = true; loadProfile(); });
              }
            });
          }

          // Like button
          var likeBtn = document.getElementById('like-btn');
          if (likeBtn) {
            likeBtn.addEventListener('click', function() {
              if (!currentUser) return;
              var ratingRef = db.collection('users').doc(profileUid).collection('ratings').doc(currentUser.uid);
              if (myVote === 'like') {
                ratingRef.delete().then(loadProfile);
              } else {
                ratingRef.set({ vote: 'like' }).then(loadProfile);
              }
            });
          }

          // Dislike button
          var dislikeBtn = document.getElementById('dislike-btn');
          if (dislikeBtn) {
            dislikeBtn.addEventListener('click', function() {
              if (!currentUser) return;
              var ratingRef = db.collection('users').doc(profileUid).collection('ratings').doc(currentUser.uid);
              if (myVote === 'dislike') {
                ratingRef.delete().then(loadProfile);
              } else {
                ratingRef.set({ vote: 'dislike' }).then(loadProfile);
              }
            });
          }
        });
      });
    });
  }
</script>
</body>
</html>
