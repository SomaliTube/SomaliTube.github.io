<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - SomaliTube</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; height: 68px; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 28px; color: #fff; text-decoration: none; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; }
    #auth-area { margin-left: auto; }
    main { flex: 1; max-width: 700px; width: 100%; margin: 0 auto; padding: 32px 16px; }
    .profile-box { background: #1e1e1e; border: 2px solid #ff6a00; padding: 28px; margin-bottom: 20px; }
    .top-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .avatar { width: 90px; height: 90px; background: #ff6a00; border: 3px solid #e05a00; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #fff; font-family: 'Bangers', Impact, fantasy; flex-shrink: 0; }
    .info h2 { font-family: 'Bangers', Impact, fantasy; font-size: 28px; letter-spacing: 2px; color: #fff; text-shadow: 2px 2px 0px #ff6a00; }
    .info p { font-size: 12px; color: #666; margin-top: 4px; }
    .bio-section { border-top: 2px solid #2a2a2a; padding-top: 16px; }
    .bio-label { font-size: 11px; font-weight: 900; color: #ff6a00; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .bio-text { font-size: 13px; color: #ccc; line-height: 1.6; min-height: 20px; }
    .bio-edit { width: 100%; min-height: 80px; background: #2a2a2a; border: 2px solid #333; color: #f1f1f1; font-size: 13px; font-family: 'Nunito', sans-serif; padding: 10px 12px; outline: none; resize: vertical; display: none; }
    .bio-edit:focus { border-color: #ff6a00; }
    .btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn { height: 38px; padding: 0 20px; font-size: 13px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; }
    .btn-outline { background: transparent; color: #ff6a00; }
    .btn-outline:hover { background: #ff6a00; color: #fff; }
    .btn-fill { background: #ff6a00; color: #fff; }
    .btn-fill:hover { background: #e05a00; }
    .btn-danger { border-color: #ff4444; background: transparent; color: #ff4444; }
    .btn-danger:hover { background: #ff4444; color: #fff; }
    footer { background: #1a1a1a; border-top: 4px solid #ff6a00; padding: 14px 20px; text-align: center; font-size: 12px; color: #444; }
    footer a { color: #ff6a00; text-decoration: none; }
  </style>
</head>
<body>
<div id="topbar">
  <a href="index.html" id="logo">SOMALITUBE!!!!</a>
  <div id="auth-area"></div>
</div>
<main><div id="profile-wrap">Loading...</div></main>
<footer><span>&copy; 2025 SomaliTube.</span><span> | </span><span>Contact: <a href="mailto:arneper606@gmail.com">arneper606@gmail.com</a></span></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({ apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw", authDomain: "somalitube98.firebaseapp.com", projectId: "somalitube98", storageBucket: "somalitube98.firebasestorage.app", messagingSenderId: "301195499282", appId: "1:301195499282:web:b89255bba0f5ed1eba05cb" });
  var auth = firebase.auth();
  var db = firebase.firestore();
  var editingBio = false;

  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = 'login.html'; return; }
    var i = (user.displayName||'?')[0].toUpperCase();
    document.getElementById('auth-area').innerHTML = '<a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#f1f1f1;margin-left:auto;"><div style="width:38px;height:38px;background:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;font-family:Bangers,Impact,fantasy;">' + i + '</div><span style="font-size:13px;font-weight:900;">' + (user.displayName||'Profile') + '</span></a>';

    db.collection('users').doc(user.uid).get().then(function(doc) {
      var bio = doc.exists ? (doc.data().bio || '') : '';

      document.getElementById('profile-wrap').innerHTML =
        '<div class="profile-box">' +
          '<div class="top-row">' +
            '<div class="avatar">' + i + '</div>' +
            '<div class="info">' +
              '<h2>' + (user.displayName||'No Username') + '</h2>' +
              '<p>' + user.email + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="bio-section">' +
            '<div class="bio-label">Bio</div>' +
            '<div class="bio-text" id="bio-text">' + (bio || '<span style="color:#555;">No bio yet. Click Edit Bio to add one!</span>') + '</div>' +
            '<textarea class="bio-edit" id="bio-edit">' + bio + '</textarea>' +
          '</div>' +
          '<div class="btns">' +
            '<button class="btn btn-outline" id="edit-bio-btn">✏️ Edit Bio</button>' +
            '<a href="user.html?uid=' + user.uid + '" class="btn btn-fill">👁 View Public Profile</a>' +
            '<button class="btn btn-danger" onclick="firebase.auth().signOut().then(function(){ window.location.href=\'index.html\'; })">Log Out</button>' +
          '</div>' +
        '</div>';

      document.getElementById('edit-bio-btn').addEventListener('click', function() {
        editingBio = !editingBio;
        var bioText = document.getElementById('bio-text');
        var bioEdit = document.getElementById('bio-edit');
        var btn = document.getElementById('edit-bio-btn');
        if (editingBio) {
          bioText.style.display = 'none';
          bioEdit.style.display = 'block';
          bioEdit.focus();
          btn.textContent = '💾 Save Bio';
        } else {
          var newBio = bioEdit.value.trim();
          db.collection('users').doc(user.uid).update({ bio: newBio }).then(function() {
            bioText.style.display = 'block';
            bioEdit.style.display = 'none';
            bioText.textContent = newBio || 'No bio yet.';
            btn.textContent = '✏️ Edit Bio';
          });
        }
      });
    });
  });
</script>
</body>
</html>
