<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - SomaliTube</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; height: 68px; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 32px; color: #fff; text-decoration: none; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; }
    #logo span { color: #ff6a00; text-shadow: 3px 3px 0px #111; }
    #auth-area { margin-left: auto; }
    main { flex: 1; max-width: 700px; width: 100%; margin: 0 auto; padding: 32px 16px; }
    .profile-box { background: #1e1e1e; border: 2px solid #ff6a00; padding: 28px; display: flex; align-items: center; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
    .avatar { width: 90px; height: 90px; background: #ff6a00; border: 3px solid #ff6a00; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #fff; font-family: 'Bangers', Impact, fantasy; flex-shrink: 0; }
    .info h2 { font-family: 'Bangers', Impact, fantasy; font-size: 28px; letter-spacing: 2px; color: #fff; text-shadow: 2px 2px 0px #ff6a00; }
    .info p { font-size: 12px; color: #666; margin-top: 4px; }
    .btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn { height: 38px; padding: 0 20px; font-size: 13px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; }
    .btn-outline { background: transparent; color: #ff6a00; }
    .btn-outline:hover { background: #ff6a00; color: #fff; }
    .btn-fill { background: #ff6a00; color: #fff; }
    .btn-fill:hover { background: #e05a00; }
    .btn-danger { border-color: #ff4444; background: transparent; color: #ff4444; }
    .btn-danger:hover { background: #ff4444; color: #fff; }
    footer { background: #1a1a1a; border-top: 4px solid #ff6a00; padding: 14px 20px; text-align: center; font-size: 12px; color: #444; }
    footer a { color: #ff6a00; text-decoration: none; }
  </style>
</head>
<body>
<div id="topbar">
  <a href="index.html" id="logo">Somali<span>Tube</span></a>
  <div id="auth-area"></div>
</div>
<main>
  <div id="profile-wrap">Loading...</div>
</main>
<footer><span>&copy; 2025 SomaliTube.</span><span> | </span><span>Contact: <a href="mailto:arneper606@gmail.com">arneper606@gmail.com</a></span></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({ apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw", authDomain: "somalitube98.firebaseapp.com", projectId: "somalitube98", storageBucket: "somalitube98.firebasestorage.app", messagingSenderId: "301195499282", appId: "1:301195499282:web:b89255bba0f5ed1eba05cb" });
  var auth = firebase.auth();
  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = 'login.html'; return; }
    var initial = (user.displayName || '?')[0].toUpperCase();
    document.getElementById('auth-area').innerHTML = '<a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#f1f1f1;margin-left:auto;"><div style="width:38px;height:38px;background:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;font-family:Bangers,Impact,fantasy;">' + initial + '</div><span style="font-size:13px;font-weight:900;">' + (user.displayName||'Profile') + '</span></a>';
    document.getElementById('profile-wrap').innerHTML =
      '<div class="profile-box">' +
        '<div class="avatar">' + initial + '</div>' +
        '<div class="info">' +
          '<h2>' + (user.displayName || 'No Username') + '</h2>' +
          '<p>' + user.email + '</p>' +
          '<div class="btns">' +
            '<a href="user.html?uid=' + user.uid + '" class="btn btn-fill">👁 View Public Profile</a>' +
            '<button class="btn btn-danger" onclick="firebase.auth().signOut().then(function(){ window.location.href=\'index.html\'; })">Log Out</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  });
</script>
</body>
</html>
