<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SomaliTube</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; height: 68px; display: flex; align-items: center; padding: 0 16px; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 28px; color: #fff; text-decoration: none; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; white-space: nowrap; }
    #logo span { color: #ff6a00; text-shadow: 3px 3px 0px #111; }
    #search-wrap { display: flex; flex: 1; max-width: 420px; margin: 0 auto; }
    #search-input { flex: 1; height: 36px; background: #2a2a2a; border: 2px solid #333; border-right: none; color: #fff; font-size: 13px; font-family: 'Nunito', sans-serif; padding: 0 12px; outline: none; }
    #search-input::placeholder { color: #666; }
    #search-input:focus { border-color: #ff6a00; }
    #search-btn { height: 36px; padding: 0 16px; background: #ff6a00; border: 2px solid #ff6a00; color: #fff; font-size: 12px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; letter-spacing: 1px; }
    #search-btn:hover { background: #e05a00; }
    .topbar-btn { height: 34px; padding: 0 14px; font-size: 12px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; white-space: nowrap; letter-spacing: 0.5px; }
    .topbar-btn.outline { background: transparent; color: #ff6a00; }
    .topbar-btn.outline:hover { background: #ff6a00; color: #fff; }
    .topbar-btn.fill { background: #ff6a00; color: #fff; }
    .topbar-btn.fill:hover { background: #e05a00; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .auth-btn { height: 36px; padding: 0 20px; font-size: 13px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; letter-spacing: 0.5px; }
    #btn-login { background: transparent; color: #ff6a00; }
    #btn-login:hover { background: #ff6a00; color: #fff; }
    #btn-signup { background: #ff6a00; color: #fff; }
    #btn-signup:hover { background: #e05a00; }
    #hero { background: #ff6a00; padding: 28px 20px; text-align: center; border-bottom: 4px solid #e05a00; }
    #hero h2 { font-family: 'Bangers', Impact, fantasy; font-size: 42px; color: #fff; letter-spacing: 3px; text-shadow: 3px 3px 0px #111; }
    #hero p { font-size: 14px; color: #fff; margin-top: 6px; font-weight: 700; opacity: 0.9; }
    main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 28px 16px; }
    .section-label { font-family: 'Bangers', Impact, fantasy; font-size: 22px; color: #ff6a00; letter-spacing: 2px; margin-bottom: 16px; border-left: 5px solid #ff6a00; padding-left: 12px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .video-card { background: #1e1e1e; border: 2px solid #2a2a2a; cursor: pointer; display: flex; flex-direction: column; transition: border-color 0.15s, transform 0.15s; }
    .video-card:hover { border-color: #ff6a00; transform: translateY(-3px); }
    .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #2a2a2a; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration { position: absolute; bottom: 6px; right: 6px; background: #ff6a00; color: #fff; font-size: 11px; font-weight: 900; padding: 2px 7px; font-family: 'Nunito', sans-serif; }
    .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; background: rgba(0,0,0,0.4); }
    .video-card:hover .play-overlay { opacity: 1; }
    .play-overlay svg { width: 52px; height: 52px; fill: #ff6a00; }
    .v-info { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 5px; }
    .v-title { font-size: 14px; font-weight: 900; color: #f1f1f1; text-decoration: none; line-height: 1.35; font-family: 'Nunito', sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .v-title:hover { color: #ff6a00; }
    .v-channel a { font-size: 12px; color: #ff6a00; text-decoration: none; font-weight: 700; }
    .v-channel a:hover { text-decoration: underline; }
    .v-meta { font-size: 11px; color: #555; }
    footer { background: #1a1a1a; border-top: 4px solid #ff6a00; padding: 16px 20px; text-align: center; font-size: 12px; color: #444; font-family: 'Nunito', sans-serif; }
    footer a { color: #ff6a00; text-decoration: none; }
    footer span { margin: 0 8px; }
  </style>
</head>

<script>
  firebase.initializeApp({ apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw", authDomain: "somalitube98.firebaseapp.com", projectId: "somalitube98", storageBucket: "somalitube98.firebasestorage.app", messagingSenderId: "301195499282", appId: "1:301195499282:web:b89255bba0f5ed1eba05cb" });
  firebase.auth().onAuthStateChanged(function(user) {
    var authArea = document.getElementById('auth-area');

    if (user) {

      uploadWrap.innerHTML = '<a href="https://docs.google.com/forms/d/e/1FAIpQLSesVkUCUFMIIiHSAhhaGc3zPu1Fk8IJroeHty4TWqTGf13wog/viewform?usp=header" target="_blank" class="topbar-btn fill">Make de video!</a>';
    }
  });
  var searchInput = document.getElementById('search-input');
  var searchBtn = document.getElementById('search-btn');
  function runSearch() {
    var query = searchInput.value.toLowerCase().trim();
    document.querySelectorAll('.video-card').forEach(function(card) {
      var title = card.querySelector('.v-title').textContent.toLowerCase();
      card.style.display = (!query || title.includes(query)) ? 'flex' : 'none';
    });
  }
  searchBtn.addEventListener('click', runSearch);
  searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') runSearch(); });
</script>
