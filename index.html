<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SomaliTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5f5f5;
      color: #111;
      font-family: Verdana, Geneva, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    #topbar {
      background: #fff;
      border-bottom: 4px solid #ff6a00;
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #logo {
      font-size: 26px;
      font-weight: 900;
      color: #111;
      text-decoration: none;
      font-family: Impact, fantasy;
      letter-spacing: 1px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    #logo span { color: #ff6a00; }

    #search-wrap {
      display: flex;
      flex: 1;
      max-width: 480px;
      margin: 0 auto;
    }

    #search-input {
      flex: 1;
      height: 34px;
      background: #fff;
      border: 1px solid #ccc;
      border-right: none;
      color: #111;
      font-size: 13px;
      font-family: Verdana, sans-serif;
      padding: 0 10px;
      outline: none;
    }

    #search-input:focus { border-color: #ff6a00; }

    #search-btn {
      width: 70px;
      height: 34px;
      background: #ff6a00;
      border: 1px solid #cc5500;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      font-family: Verdana, sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    #search-btn:hover { background: #e05a00; }

    #auth-area {
      margin-left: auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .auth-btn {
      height: 44px;
      padding: 0 32px;
      font-size: 13px;
      font-weight: bold;
      font-family: Verdana, sans-serif;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      border: 2px solid #ff6a00;
    }

    #btn-login {
      background: #fff;
      color: #ff6a00;
    }

    #btn-login:hover { background: #fff3ec; }

    #btn-signup {
      background: #ff6a00;
      color: #fff;
      border-color: #dd5500;
    }

    #btn-signup:hover { background: #e05a00; }

    /* MAIN */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: bold;
      color: #ff6a00;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-family: Verdana, sans-serif;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }

    /* VIDEO GRID */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: #fff;
      border: 1px solid #ddd;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover { border-color: #ff6a00; }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #eee;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: #000;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 5px;
      font-family: Verdana, sans-serif;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.1s;
      background: rgba(0,0,0,0.2);
    }

    .video-card:hover .play-overlay { opacity: 1; }

    .play-overlay svg {
      width: 44px;
      height: 44px;
      fill: #ff6a00;
    }

    .v-info {
      padding: 8px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .v-title {
      font-size: 13px;
      font-weight: bold;
      color: #111;
      text-decoration: none;
      line-height: 1.4;
      font-family: Verdana, sans-serif;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .v-title:hover { color: #ff6a00; text-decoration: underline; }

    .v-channel a {
      font-size: 11px;
      color: #777;
      text-decoration: underline;
      font-family: Verdana, sans-serif;
    }

    .v-channel a:hover { color: #ff6a00; }

    .v-meta {
      font-size: 10px;
      color: #aaa;
      font-family: Verdana, sans-serif;
    }

    /* FOOTER */
    footer {
      background: #fff;
      border-top: 4px solid #ff6a00;
      padding: 14px 20px;
      text-align: left;
      font-size: 11px;
      color: #aaa;
      font-family: Verdana, sans-serif;
    }

    footer a { color: #ff6a00; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    footer span { margin: 0 6px; }
  </style>
</head>

      authArea.innerHTML = `
        <a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#111;">
          ${pfp}
          <span style="font-size:13px;font-weight:bold;font-family:Verdana,sans-serif;">${user.displayName || 'Profile'}</span>
        </a>`;
    }
  });
</script>
