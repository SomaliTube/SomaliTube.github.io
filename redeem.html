<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redeem Code - SomaliTube</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; height: 68px; display: flex; align-items: center; padding: 0 16px; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 28px; color: #fff; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; white-space: nowrap; text-decoration: none; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    main { flex: 1; max-width: 500px; width: 100%; margin: 60px auto; padding: 0 16px; }
    .redeem-box { background: #1e1e1e; border: 2px solid #ff6a00; padding: 32px; text-align: center; }
    h1 { font-family: 'Bangers', Impact, fantasy; font-size: 32px; color: #ff6a00; letter-spacing: 2px; margin-bottom: 16px; }
    input { width: 100%; height: 46px; background: #2a2a2a; border: 2px solid #333; color: #fff; font-size: 16px; font-family: 'Nunito', sans-serif; padding: 0 14px; outline: none; margin-bottom: 16px; text-align: center; font-weight: 900; letter-spacing: 1px; }
    input:focus { border-color: #ff6a00; }
    button { width: 100%; height: 46px; background: #ff6a00; border: none; color: #fff; font-size: 15px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; }
    button:hover { background: #e05a00; }
    .msg { margin-top: 14px; font-size: 14px; font-weight: 900; }
  </style>
</head>
<body class="has-side">
  <div id="topbar">
    <a href="index.html" id="logo">SOMALITUBE</a>
    <div id="auth-area"></div>
  </div>
  <main>
    <div class="redeem-box">
      <h1>Redeem Gift Code</h1>
      <p style="font-size:13px;color:#aaa;margin-bottom:20px;">Enter your code below to claim free SomaliPoints!</p>
      <input type="text" id="code-input" placeholder="ENTER CODE HERE">
      <button id="redeem-btn">Redeem Points</button>
      <div class="msg" id="msg"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="st.js"></script>
  <script>
    var me = null;
    auth.onAuthStateChanged(function(user) {
      if (!user) { location.href = 'login.html'; return; }
      me = user;
      stNav(user);
    });

    document.getElementById('redeem-btn').addEventListener('click', function() {
      if (!me) return;
      var code = document.getElementById('code-input').value.trim().toUpperCase();
      var msg = document.getElementById('msg');
      if (!code) { msg.style.color = '#ff5a5a'; msg.innerText = 'Please enter a code.'; return; }

      var codeRef = db.collection('redeem_codes').doc(code);
      var walletRef = db.collection('wallets').doc(me.uid);

      db.runTransaction(function(t) {
        return t.get(codeRef).then(function(doc) {
          if (!doc.exists) throw new Error('Invalid code.');
          var data = doc.data();
          if (data.claimedGlobal) throw new Error('This code has already been redeemed.');
          if (data.claimedBy && data.claimedBy[me.uid]) throw new Error('You have already redeemed this code.');
          
          var ptsToAdd = data.points || 0;
          return t.get(walletRef).then(function(wDoc) {
            var currentPts = wDoc.exists ? (wDoc.data().points || 0) : 0;
            t.set(walletRef, { points: currentPts + ptsToAdd }, { merge: true });
            if (data.singleUse) {
              t.update(codeRef, { claimedGlobal: true, ['claimedBy.' + me.uid]: true });
            } else {
              t.update(codeRef, { ['claimedBy.' + me.uid]: true });
            }
            return ptsToAdd;
          });
        });
      }).then(function(added) {
        msg.style.color = '#2fd16f';
        msg.innerText = 'Success! Claimed ' + added + ' SomaliPoints! 🎉';
        document.getElementById('code-input').value = '';
      }).catch(function(err) {
        msg.style.color = '#ff5a5a';
        msg.innerText = err.message;
      });
    });
  </script>
</body>
</html>
