<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redeem - SomaliTube</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; min-height: 68px; display: flex; flex-wrap: wrap; align-items: center; padding: 8px 16px; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 28px; color: #fff; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; white-space: nowrap; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    main { flex: 1; max-width: 520px; width: 100%; margin: 0 auto; padding: 40px 16px; }
    .box { background: #1e1e1e; border: 3px solid #ff6a00; box-shadow: 8px 8px 0 #000; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .box h1 { font: 40px 'Bangers', Impact, fantasy; letter-spacing: 3px; color: #fff; text-shadow: 3px 3px 0 #ff6a00; font-weight: normal; }
    .box p { font-size: 13px; color: #aaa; line-height: 1.5; }
    #code { height: 52px; background: #2a2a2a; border: 2px solid #333; color: #fff; font: 900 22px 'Nunito', sans-serif; letter-spacing: 3px; text-align: center; text-transform: uppercase; outline: none; padding: 0 12px; }
    #code:focus { border-color: #ff6a00; }
    #go { height: 52px; background: #ff6a00; border: none; color: #fff; font: 26px 'Bangers', Impact, fantasy; letter-spacing: 3px; cursor: pointer; }
    #go:hover { background: #e05a00; }
    #go:disabled { opacity: .6; cursor: wait; }
    #msg { font-size: 15px; font-weight: 900; min-height: 22px; }
    #msg.ok { color: #2fd16f; } #msg.bad { color: #ff5a5a; }
    .back { font-size: 13px; font-weight: 900; color: #ff6a00; }
    footer { background: #1a1a1a; border-top: 4px solid #ff6a00; padding: 14px 20px; text-align: center; font-size: 12px; color: #666; }
  </style>
</head>
<body>
<div id="topbar">
  <a href="index.html" id="logo">SOMALITUBE!!!!</a>
  <div id="upload-btn-wrap"></div>
  <div id="auth-area"><a href="login.html" class="auth-btn" id="btn-login">Log In</a></div>
</div>
<main>
  <form class="box" id="f">
    <div style="font-size:54px;line-height:1">&#127903;&#65039;</div>
    <h1>REDEEM A CODE</h1>
    <p>Got a code? Type it in and get free SomaliPoints. Each code works once per person.</p>
    <input id="code" type="text" maxlength="30" placeholder="ENTER CODE" autocomplete="off" spellcheck="false">
    <button id="go" type="submit">REDEEM!</button>
    <div id="msg"></div>
    <a href="shop.html" class="back">&larr; Back to the Shop</a>
  </form>
</main>
<footer>&copy; 1972 SomaliTube. No rights reserved. <span style="margin:0 8px;">|</span> Version 1.0</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="st.js"></script>
<script>
  var $ = function(i) { return document.getElementById(i); };
  var cu = null, tries = 0;
  auth.onAuthStateChanged(function(u) { if (!u) return location.href = 'login.html'; cu = u; stNav(u); });
  $('f').onsubmit = function(e) {
    e.preventDefault();
    var c = $('code').value.trim(); if (!c || !cu) return;
    if (++tries > 8) { $('msg').className = 'bad'; $('msg').textContent = 'Too many tries. Refresh the page and wait a bit.'; return; }
    $('go').disabled = true; $('msg').className = ''; $('msg').textContent = '';
    stRedeem(c).then(function(pts) { $('msg').className = 'ok'; $('msg').innerHTML = '&#127881; +' + stFmt(pts) + ' SomaliPoints!'; $('code').value = ''; })
      .catch(function(err) { $('msg').className = 'bad'; $('msg').textContent = err.message; })
      .then(function() { $('go').disabled = false; });
  };
</script>
</body>
</html>
