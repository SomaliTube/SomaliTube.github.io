<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Channels - SomaliTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; font-family: Verdana, Geneva, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #fff; border-bottom: 4px solid #ff6a00; height: 72px; display: flex; align-items: center; padding: 0 16px; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #logo { font-size: 26px; font-weight: 900; color: #111; text-decoration: none; font-family: Impact, fantasy; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
    #logo span { color: #ff6a00; }
    #search-wrap { display: flex; flex: 1; max-width: 400px; margin: 0 auto; }
    #search-input { flex: 1; height: 34px; background: #fff; border: 1px solid #ccc; border-right: none; color: #111; font-size: 13px; font-family: Verdana, sans-serif; padding: 0 10px; outline: none; }
    #search-input:focus { border-color: #ff6a00; }
    #search-btn { width: 70px; height: 34px; background: #ff6a00; border: 1px solid #cc5500; color: #fff; font-size: 12px; font-weight: bold; font-family: Verdana, sans-serif; cursor: pointer; }
    #search-btn:hover { background: #e05a00; }
    .topbar-btn { height: 34px; padding: 0 14px; font-size: 12px; font-weight: bold; font-family: Verdana, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; white-space: nowrap; }
    .topbar-btn.outline { background: #fff; color: #ff6a00; }
    .topbar-btn.outline:hover { background: #fff3ec; }
    .topbar-btn.fill { background: #ff6a00; color: #fff; }
    .topbar-btn.fill:hover { background: #e05a00; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .auth-btn { height: 44px; padding: 0 32px; font-size: 13px; font-weight: bold; font-family: Verdana, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; }
    #btn-login { background: #fff; color: #ff6a00; }
    #btn-login:hover { background: #fff3ec; }
    #btn-signup { background: #ff6a00; color: #fff; }
    #btn-signup:hover { background: #e05a00; }
    main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 28px 16px; }
    .section-label { font-size: 11px; font-weight: bold; color: #ff6a00; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .channel-card { background: #fff; border: 1px solid #ddd; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; text-decoration: none; }
    .channel-card:hover { border-color: #ff6a00; }
    .ch-avatar { width: 70px; height: 70px; background: #ff6a00; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #fff; font-family: Impact, fantasy; margin-bottom: 10px; }
    .ch-name { font-size: 13px; font-weight: bold; color: #111; font-family: Verdana, sans-serif; }
    .ch-subs { font-size: 11px; color: #aaa; margin-top: 4px; }
    .loading { font-size: 13px; color: #aaa; }
    footer { background: #fff; border-top: 4px solid #ff6a00; padding: 14px 20px; font-size: 11px; color: #aaa; font-family: Verdana, sans-serif; }
    footer a { color: #ff6a00; text-decoration: none; }
  </style>
</head>
<body>
<div id="topbar">
  <a href="index.html" id="logo">Somali<span>Tube</span></a>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="Search" />
    <button id="search-btn">Search</button>
  </div>
  <a href="channels.html" class="topbar-btn outline">All Channels</a>
  <div id="upload-btn-wrap"></div>
  <div id="auth-area">
    <a href="login.html" class="auth-btn" id="btn-login">Log In</a>
    <a href="signup.html" class="auth-btn" id="btn-signup">Sign Up</a>
  </div>
</div>
<main>
  <div class="section-label">All Channels</div>
  <div class="channels-grid" id="channels-grid">
    <div class="loading">Loading channels...</div>
  </div>
</main>
<footer>
  <span>&copy; 2025 SomaliTube.</span>
  <span>|</span>
  <span>Contact: <a href="mailto:arneper606@gmail.com">arneper606@gmail.com</a></span>
</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw",
    authDomain: "somalitube98.firebaseapp.com",
    projectId: "somalitube98",
    storageBucket: "somalitube98.firebasestorage.app",
    messagingSenderId: "301195499282",
    appId: "1:301195499282:web:b89255bba0f5ed1eba05cb"
  });
  var auth = firebase.auth();
  var db = firebase.firestore();

  auth.onAuthStateChanged(function(user) {
    var authArea = document.getElementById('auth-area');
    var uploadWrap = document.getElementById('upload-btn-wrap');
    if (user) {
      var initial = (user.displayName || '?')[0].toUpperCase();
      authArea.innerHTML = '<a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#111;"><div style="width:40px;height:40px;background:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;font-family:Impact,fantasy;">' + initial + '</div><span style="font-size:13px;font-weight:bold;font-family:Verdana,sans-serif;">' + (user.displayName || 'Profile') + '</span></a>';
      uploadWrap.innerHTML = '<a href="https://docs.google.com/forms/d/e/1FAIpQLSesVkUCUFMIIiHSAhhaGc3zPu1Fk8IJroeHty4TWqTGf13wog/viewform?usp=header" target="_blank" class="topbar-btn fill">Upload Video</a>';
    }
  });

  db.collection('users').get().then(function(snap) {
    var grid = document.getElementById('channels-grid');
    if (snap.empty) { grid.innerHTML = '<div class="loading">No channels yet.</div>'; return; }
    grid.innerHTML = '';
    snap.forEach(function(doc) {
      var d = doc.data();
      var initial = (d.username || '?')[0].toUpperCase();
      grid.innerHTML += '<a href="user.html?uid=' + doc.id + '" class="channel-card"><div class="ch-avatar">' + initial + '</div><div class="ch-name">' + (d.username || 'Unknown') + '</div><div class="ch-subs" id="subs-' + doc.id + '">Loading...</div></a>';
    });
    snap.forEach(function(doc) {
      db.collection('users').doc(doc.id).collection('subscribers').get().then(function(s) {
        var el = document.getElementById('subs-' + doc.id);
        if (el) el.textContent = s.size + ' subscribers';
      });
    });
  });
</script>
</body>
</html>
