<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - SomaliTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      font-family: Verdana, Geneva, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #topbar {
      background: #fff;
      border-bottom: 4px solid #ff6a00;
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
    }
    #logo {
      font-size: 26px;
      font-weight: 900;
      color: #111;
      text-decoration: none;
      font-family: Impact, fantasy;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    #logo span { color: #ff6a00; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .auth-btn {
      height: 44px; padding: 0 32px; font-size: 13px; font-weight: bold;
      font-family: Verdana, sans-serif; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; border: 2px solid #ff6a00;
    }
    #btn-login { background: #fff; color: #ff6a00; }
    #btn-login:hover { background: #fff3ec; }
    #btn-signup { background: #ff6a00; color: #fff; }
    #btn-signup:hover { background: #e05a00; }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 16px;
    }
    .profile-header {
      background: #fff;
      border: 1px solid #ddd;
      padding: 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
    }
    .pfp {
      width: 90px;
      height: 90px;
      border: 3px solid #ff6a00;
      object-fit: cover;
      flex-shrink: 0;
    }
    .pfp-placeholder {
      width: 90px;
      height: 90px;
      border: 3px solid #ff6a00;
      background: #ff6a00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      font-family: Impact, fantasy;
      flex-shrink: 0;
    }
    .profile-info h2 {
      font-size: 22px;
      font-family: Impact, fantasy;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #111;
    }
    .profile-info p {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .section-label {
      font-size: 11px;
      font-weight: bold;
      color: #ff6a00;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .video-card {
      background: #fff;
      border: 1px solid #ddd;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .video-card:hover { border-color: #ff6a00; }
    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #eee;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration {
      position: absolute; bottom: 4px; right: 4px;
      background: #000; color: #fff; font-size: 10px;
      font-weight: bold; padding: 1px 5px;
    }
    .v-info { padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    .v-title {
      font-size: 12px; font-weight: bold; color: #111;
      text-decoration: none; line-height: 1.4;
    }
    .v-title:hover { color: #ff6a00; text-decoration: underline; }
    .v-meta { font-size: 10px; color: #aaa; }
    .not-found {
      font-size: 13px; color: #888; text-align: center; padding: 40px;
    }
    .loading { font-size: 13px; color: #aaa; padding: 20px 0; }
    footer {
      background: #fff;
      border-top: 4px solid #ff6a00;
      padding: 14px 20px;
      font-size: 11px;
      color: #aaa;
      font-family: Verdana, sans-serif;
    }
    footer a { color: #ff6a00; text-decoration: none; }
  </style>
</head>
<body>

<div id="topbar">
  <a href="index.html" id="logo">Somali<span>Tube</span></a>
  <div id="auth-area">
    <a href="login.html" class="auth-btn" id="btn-login">Log In</a>
    <a href="signup.html" class="auth-btn" id="btn-signup">Sign Up</a>
  </div>
</div>

<main>
  <div id="profile-header-wrap" class="loading">Loading profile...</div>
  <div id="videos-section" style="display:none;">
    <div class="section-label">Videos</div>
    <div class="video-grid" id="video-grid">
      <div style="font-size:12px;color:#aaa;">This user hasn't uploaded any videos yet.</div>
    </div>
  </div>
</main>

<footer>
  <span>&copy; 2025 SomaliTube.</span>
  <span>|</span>
  <span>Contact: <a href="mailto:arneper606@gmail.com">arneper606@gmail.com</a></span>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw",
    authDomain: "somalitube98.firebaseapp.com",
    projectId: "somalitube98",
    storageBucket: "somalitube98.firebasestorage.app",
    messagingSenderId: "301195499282",
    appId: "1:301195499282:web:b89255bba0f5ed1eba05cb"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Update topbar based on login state
  onAuthStateChanged(auth, user => {
    const authArea = document.getElementById('auth-area');
    if (user) {
      const initial = (user.displayName || '?')[0].toUpperCase();
      const pfp = user.photoURL
        ? `<img src="${user.photoURL}" style="width:40px;height:40px;object-fit:cover;border:2px solid #ff6a00;" />`
        : `<div style="width:40px;height:40px;background:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;font-family:Impact,fantasy;">${initial}</div>`;
      authArea.innerHTML = `
        <a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#111;">
          ${pfp}
          <span style="font-size:13px;font-weight:bold;font-family:Verdana,sans-serif;">${user.displayName || 'Profile'}</span>
        </a>`;
    }
  });

  // Get uid from URL
  const params = new URLSearchParams(window.location.search);
  const uid = params.get('uid');
  const wrap = document.getElementById('profile-header-wrap');

  if (!uid) {
    wrap.innerHTML = '<div class="not-found">No user specified.</div>';
  } else {
    // Load user data from Firestore
    const userDoc = await getDoc(doc(db, 'users', uid));
    if (!userDoc.exists()) {
      wrap.innerHTML = '<div class="not-found">User not found.</div>';
    } else {
      const data = userDoc.data();
      const initial = (data.username || '?')[0].toUpperCase();
      const pfpHTML = data.pfpURL
        ? `<img class="pfp" src="${data.pfpURL}" alt="pfp" />`
        : `<div class="pfp-placeholder">${initial}</div>`;

      wrap.innerHTML = `
        <div class="profile-header">
          ${pfpHTML}
          <div class="profile-info">
            <h2>${data.username || 'Unknown'}</h2>
            <p>Member of SomaliTube</p>
          </div>
        </div>`;

      // Show videos section
      document.getElementById('videos-section').style.display = 'block';

      // Load their videos (will work once video upload system is built)
      try {
        const q = query(collection(db, 'videos'), where('uid', '==', uid), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        if (!snap.empty) {
          const grid = document.getElementById('video-grid');
          grid.innerHTML = '';
          snap.forEach(d => {
            const v = d.data();
            grid.innerHTML += `
              <div class="video-card">
                <a href="watch.html?v=${d.id}" style="text-decoration:none;">
                  <div class="thumb-wrap">
                    <img src="${v.thumbnailURL || 'https://via.placeholder.com/320x180/ff6a00/fff?text=Video'}" alt="${v.title}" />
                    <div class="duration">${v.duration || '0:00'}</div>
                  </div>
                </a>
                <div class="v-info">
                  <a href="watch.html?v=${d.id}" class="v-title">${v.title}</a>
                  <div class="v-meta">${v.views || 0} views</div>
                </div>
              </div>`;
          });
        }
      } catch(e) {
        // Videos collection doesn't exist yet, that's fine
      }
    }
  }
</script>
</body>
</html>
