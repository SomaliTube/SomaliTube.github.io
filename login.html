<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - SomaliTube</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; height: 68px; display: flex; align-items: center; padding: 0 16px; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 28px; color: #fff; text-decoration: none; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; }
    #logo span { color: #ff6a00; text-shadow: 3px 3px 0px #111; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .box { background: #1e1e1e; border: 2px solid #ff6a00; padding: 36px 32px; width: 100%; max-width: 420px; }
    h1 { font-family: 'Bangers', Impact, fantasy; font-size: 32px; letter-spacing: 2px; margin-bottom: 24px; color: #fff; text-shadow: 2px 2px 0px #ff6a00; }
    h1 span { color: #ff6a00; text-shadow: 2px 2px 0px #111; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 900; color: #ff6a00; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    input[type=email], input[type=password] { width: 100%; height: 40px; border: 2px solid #333; background: #2a2a2a; font-size: 13px; font-family: 'Nunito', sans-serif; padding: 0 12px; outline: none; color: #f1f1f1; }
    input:focus { border-color: #ff6a00; }
    .btn { width: 100%; height: 44px; background: #ff6a00; border: none; color: #fff; font-size: 16px; font-weight: 900; font-family: 'Bangers', Impact, fantasy; cursor: pointer; letter-spacing: 2px; margin-top: 8px; }
    .btn:hover { background: #e05a00; }
    .msg { margin-top: 12px; font-size: 12px; color: #ff4444; min-height: 18px; font-weight: 700; }
    .msg.success { color: #44ff88; }
    .link { margin-top: 16px; font-size: 12px; color: #666; text-align: center; }
    .link a { color: #ff6a00; text-decoration: none; font-weight: 900; }
    footer { background: #1a1a1a; border-top: 4px solid #ff6a00; padding: 14px 20px; text-align: center; font-size: 12px; color: #444; }
    footer a { color: #ff6a00; text-decoration: none; }
  </style>
</head>
<body>
<div id="topbar"><a href="index.html" id="logo">SOMALITUBE!!!!</a></div>
<main>
  <div class="box">
    <h1>Log <span>In</span></h1>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@email.com" /></div>
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="Your password" /></div>
    <button class="btn" id="login-btn">LET ME IN 🔥</button>
    <div class="msg" id="msg"></div>
    <div class="link">No account? <a href="signup.html">Sign up here</a></div>
  </div>
</main>
<footer><span>&copy; 2025 SomaliTube.</span><span> | </span><span>Contact: <a href="mailto:arneper606@gmail.com">arneper606@gmail.com</a></span></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({ apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw", authDomain: "somalitube98.firebaseapp.com", projectId: "somalitube98", storageBucket: "somalitube98.firebasestorage.app", messagingSenderId: "301195499282", appId: "1:301195499282:web:b89255bba0f5ed1eba05cb" });
  var auth = firebase.auth();
  document.getElementById('login-btn').addEventListener('click', function() {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var msg = document.getElementById('msg');
    if (!email || !password) { msg.textContent = 'Fill in all fields!'; return; }
    msg.className = 'msg'; msg.textContent = 'Logging in...';
    auth.signInWithEmailAndPassword(email, password).then(function() {
      msg.className = 'msg success'; msg.textContent = 'Logged in! Taking you home...';
      setTimeout(function() { window.location.href = 'index.html'; }, 1000);
    }).catch(function(err) {
      msg.className = 'msg';
      if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') msg.textContent = 'Wrong email or password!';
      else msg.textContent = 'Error: ' + err.message;
    });
  });
</script>
</body>
</html>
