<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch - SomaliTube</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; height: 68px; display: flex; align-items: center; padding: 0 16px; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 32px; color: #fff; text-decoration: none; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; white-space: nowrap; }
    #logo span { color: #ff6a00; text-shadow: 3px 3px 0px #111; }
    #logo span { color: #ff6a00; text-shadow: 3px 3px 0px #111; }
    #search-wrap { display: flex; flex: 1; max-width: 400px; margin: 0 auto; }
    #search-input { flex: 1; height: 36px; background: #2a2a2a; border: 2px solid #333; border-right: none; color: #fff; font-size: 13px; font-family: 'Nunito', sans-serif; padding: 0 12px; outline: none; }
    #search-input:focus { border-color: #ff6a00; }
    #search-btn { height: 36px; padding: 0 16px; background: #ff6a00; border: 2px solid #ff6a00; color: #fff; font-size: 12px; font-weight: 900; cursor: pointer; }
    .topbar-btn { height: 34px; padding: 0 14px; font-size: 12px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; white-space: nowrap; }
    .topbar-btn.outline { background: transparent; color: #ff6a00; }
    .topbar-btn.outline:hover { background: #ff6a00; color: #fff; }
    .topbar-btn.fill { background: #ff6a00; color: #fff; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .auth-btn { height: 36px; padding: 0 20px; font-size: 13px; font-weight: 900; font-family: 'Nunito', sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; border: 2px solid #ff6a00; }
    #btn-login { background: transparent; color: #ff6a00; }
    #btn-login:hover { background: #ff6a00; color: #fff; }
    #btn-signup { background: #ff6a00; color: #fff; }

    main { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 24px 16px; }

    /* VIDEO PLAYER */
    #player-wrap {
      width: 100%;
      background: #000;
      border: 3px solid #ff6a00;
      position: relative;
      aspect-ratio: 16/9;
    }

    #player-wrap iframe {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      border: none;
      display: block;
    }

    /* VIDEO INFO */
    #video-info { margin-top: 16px; }

    #video-title-text {
      font-family: 'Bangers', Impact, fantasy;
      font-size: 28px;
      letter-spacing: 1px;
      color: #fff;
      line-height: 1.2;
    }

    #video-meta { font-size: 12px; color: #555; margin-top: 6px; font-weight: 700; }

    #video-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
      border-bottom: 2px solid #222;
      padding-bottom: 16px;
    }

    .action-btn {
      height: 38px; padding: 0 18px;
      font-size: 14px; font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      border: 2px solid #333;
      background: #1e1e1e;
      color: #f1f1f1;
      display: inline-flex; align-items: center; gap: 6px;
    }

    .action-btn:hover { border-color: #ff6a00; }
    .action-btn.active { background: #ff6a00; border-color: #ff6a00; color: #fff; }
    .action-btn.active-dis { background: #333; border-color: #555; }

    #channel-row {
      display: flex; align-items: center; gap: 14px;
      margin-top: 16px; flex-wrap: wrap;
    }

    #channel-avatar {
      width: 50px; height: 50px;
      background: #ff6a00;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #fff;
      font-family: 'Bangers', Impact, fantasy;
      text-decoration: none;
      flex-shrink: 0;
    }

    #channel-name-link {
      font-size: 16px; font-weight: 900;
      color: #f1f1f1; text-decoration: none;
    }

    #channel-name-link:hover { color: #ff6a00; }
    #channel-sub-count { font-size: 12px; color: #555; margin-top: 2px; }

    #subscribe-btn {
      height: 38px; padding: 0 22px;
      font-size: 13px; font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      border: 2px solid #ff6a00;
      background: #ff6a00; color: #fff;
      margin-left: auto;
    }

    #subscribe-btn.subbed { background: transparent; color: #ff6a00; }
    #subscribe-btn:hover { background: #e05a00; color: #fff; border-color: #e05a00; }

    #video-description {
      margin-top: 16px;
      background: #1e1e1e;
      border: 2px solid #2a2a2a;
      padding: 14px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* COMMENTS */
    #comments-section { margin-top: 28px; }
    .section-label { font-family: 'Bangers', Impact, fantasy; font-size: 22px; color: #ff6a00; letter-spacing: 2px; margin-bottom: 16px; border-left: 5px solid #ff6a00; padding-left: 12px; }

    #comment-box-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
    #comment-input {
      flex: 1; min-height: 48px; padding: 10px 12px;
      background: #2a2a2a; border: 2px solid #333;
      color: #f1f1f1; font-size: 13px;
      font-family: 'Nunito', sans-serif;
      outline: none; resize: none;
    }
    #comment-input:focus { border-color: #ff6a00; }
    #comment-submit {
      height: 48px; padding: 0 20px;
      background: #ff6a00; border: none;
      color: #fff; font-size: 13px; font-weight: 900;
      font-family: 'Nunito', sans-serif;
      cursor: pointer; align-self: flex-end;
    }
    #comment-submit:hover { background: #e05a00; }
    #comment-login-msg { font-size: 13px; color: #555; margin-bottom: 20px; }
    #comment-login-msg a { color: #ff6a00; font-weight: 900; text-decoration: none; }

    .comment {
      background: #1e1e1e;
      border: 2px solid #2a2a2a;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .comment:hover { border-color: #ff6a00; }

    .comment-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .comment-avatar {
      width: 34px; height: 34px;
      background: #ff6a00;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 900; color: #fff;
      font-family: 'Bangers', Impact, fantasy;
      text-decoration: none; flex-shrink: 0;
    }
    .comment-username { font-size: 13px; font-weight: 900; color: #ff6a00; }
    .comment-time { font-size: 11px; color: #444; margin-left: auto; }
    .comment-text { font-size: 13px; color: #ccc; line-height: 1.5; }
    .no-comments { font-size: 13px; color: #555; padding: 16px 0; }

    footer { background: #1a1a1a; border-top: 4px solid #ff6a00; padding: 14px 20px; text-align: center; font-size: 12px; color: #444; margin-top: 40px; }
    footer a { color: #ff6a00; text-decoration: none; }
  </style>
</head>

  <!-- ============================================================

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({ apiKey: "AIzaSyDxOI-TwU5Sd7yYm1sfceb1HXGYMAQX3kw", authDomain: "somalitube98.firebaseapp.com", projectId: "somalitube98", storageBucket: "somalitube98.firebasestorage.app", messagingSenderId: "301195499282", appId: "1:301195499282:web:b89255bba0f5ed1eba05cb" });
  var auth = firebase.auth();
  var db = firebase.firestore();
  var currentUser = null;

  var videoId = new URLSearchParams(window.location.search).get('v') || 'video1';
  var channelUid = document.getElementById('channel-avatar').dataset.uid;

  // ── AUTH STATE
  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    var authArea = document.getElementById('auth-area');
    var uploadWrap = document.getElementById('upload-btn-wrap');
    if (user) {
      var i = (user.displayName||'?')[0].toUpperCase();
      authArea.innerHTML = '<a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#f1f1f1;"><div style="width:38px;height:38px;background:#ff6a00;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;font-family:Bangers,Impact,fantasy;">' + i + '</div><span style="font-size:13px;font-weight:900;">' + (user.displayName||'Profile') + '</span></a>';
      uploadWrap.innerHTML = '<a href="https://docs.google.com/forms/d/e/1FAIpQLSesVkUCUFMIIiHSAhhaGc3zPu1Fk8IJroeHty4TWqTGf13wog/viewform?usp=header" target="_blank" class="topbar-btn fill">Make de video!</a>';
      document.getElementById('comment-box-wrap').style.display = 'flex';
      document.getElementById('comment-login-msg').textContent = '';
    } else {
      document.getElementById('comment-login-msg').innerHTML = '<a href="login.html">Log in</a> to leave a comment.';
    }
    loadLikes();
    loadSubscribe();
    loadComments();
  });

  // ── VIDEO PLAYER CONTROLS
  var video = document.getElementById('main-video');
  var playBtn = document.getElementById('play-btn');
  var progress = document.getElementById('progress');
  var timeDisplay = document.getElementById('time-display');
  var volumeSlider = document.getElementById('volume');
  var volIcon = document.getElementById('vol-icon');

  playBtn.addEventListener('click', function() {
    if (video.paused) { video.play(); playBtn.textContent = '⏸'; }
    else { video.pause(); playBtn.textContent = '▶'; }
  });

  video.addEventListener('timeupdate', function() {
    if (video.duration) {
      progress.max = video.duration;
      progress.value = video.currentTime;
      timeDisplay.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);
    }
  });

  progress.addEventListener('input', function() { video.currentTime = progress.value; });
  volumeSlider.addEventListener('input', function() { video.volume = volumeSlider.value; volIcon.textContent = volumeSlider.value == 0 ? '🔇' : '🔊'; });
  volIcon.addEventListener('click', function() { video.muted = !video.muted; volIcon.textContent = video.muted ? '🔇' : '🔊'; });
  video.addEventListener('ended', function() { playBtn.textContent = '▶'; });
  document.getElementById('fullscreen-btn').addEventListener('click', function() { if (video.requestFullscreen) video.requestFullscreen(); });

  function fmt(s) {
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // ── LIKES / DISLIKES
  function loadLikes() {
    db.collection('videoLikes').doc(videoId).collection('likes').get().then(function(snap) {
      var likes = 0, dislikes = 0, myVote = null;
      snap.forEach(function(d) {
        if (d.data().vote === 'like') likes++; else dislikes++;
        if (currentUser && d.id === currentUser.uid) myVote = d.data().vote;
      });
      document.getElementById('like-count').textContent = likes;
      document.getElementById('dislike-count').textContent = dislikes;
      var likeBtn = document.getElementById('like-btn');
      var dislikeBtn = document.getElementById('dislike-btn');
      likeBtn.className = 'action-btn' + (myVote === 'like' ? ' active' : '');
      dislikeBtn.className = 'action-btn' + (myVote === 'dislike' ? ' active-dis' : '');
    });
  }

  document.getElementById('like-btn').addEventListener('click', function() {
    if (!currentUser) { window.location.href = 'login.html'; return; }
    var ref = db.collection('videoLikes').doc(videoId).collection('likes').doc(currentUser.uid);
    db.collection('videoLikes').doc(videoId).collection('likes').doc(currentUser.uid).get().then(function(d) {
      if (d.exists && d.data().vote === 'like') ref.delete().then(loadLikes);
      else ref.set({ vote: 'like' }).then(loadLikes);
    });
  });

  document.getElementById('dislike-btn').addEventListener('click', function() {
    if (!currentUser) { window.location.href = 'login.html'; return; }
    var ref = db.collection('videoLikes').doc(videoId).collection('likes').doc(currentUser.uid);
    db.collection('videoLikes').doc(videoId).collection('likes').doc(currentUser.uid).get().then(function(d) {
      if (d.exists && d.data().vote === 'dislike') ref.delete().then(loadLikes);
      else ref.set({ vote: 'dislike' }).then(loadLikes);
    });
  });

  // ── SUBSCRIBE
  function loadSubscribe() {
    if (!channelUid || channelUid === 'CHANNEL_UID') return;
    db.collection('users').doc(channelUid).collection('subscribers').get().then(function(snap) {
      var isSubbed = currentUser ? snap.docs.some(function(d){ return d.id === currentUser.uid; }) : false;
      var btn = document.getElementById('subscribe-btn');
      btn.textContent = isSubbed ? 'Subcreibed! ✅' : 'Subscreib! ➕';
      btn.className = isSubbed ? 'subbed' : '';
      document.getElementById('channel-sub-count').textContent = snap.size + ' subscriber' + (snap.size !== 1 ? 's' : '');
    });
  }

  document.getElementById('subscribe-btn').addEventListener('click', function() {
    if (!currentUser) { window.location.href = 'login.html'; return; }
    if (!channelUid || channelUid === 'CHANNEL_UID') return;
    var ref = db.collection('users').doc(channelUid).collection('subscribers').doc(currentUser.uid);
    ref.get().then(function(d) {
      if (d.exists) ref.delete().then(loadSubscribe); else ref.set({ uid: currentUser.uid }).then(loadSubscribe);
    });
  });

  // ── COMMENTS
  function loadComments() {
    db.collection('videoComments').doc(videoId).collection('comments').orderBy('createdAt', 'desc').get().then(function(snap) {
      var list = document.getElementById('comments-list');
      if (snap.empty) { list.innerHTML = '<div class="no-comments">No comments yet. Be the first! 👀</div>'; return; }
      list.innerHTML = '';
      snap.forEach(function(d) {
        var c = d.data();
        var initial = (c.username || '?')[0].toUpperCase();
        var date = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '';
        list.innerHTML +=
          '<div class="comment">' +
            '<div class="comment-header">' +
              '<a href="user.html?uid=' + (c.uid||'') + '" class="comment-avatar">' + initial + '</a>' +
              '<span class="comment-username">' + (c.username||'Unknown') + '</span>' +
              '<span class="comment-time">' + date + '</span>' +
            '</div>' +
            '<div class="comment-text">' + c.text.replace(/</g,'&lt;') + '</div>' +
          '</div>';
      });
    });
  }

  document.getElementById('comment-submit').addEventListener('click', function() {
    if (!currentUser) return;
    var text = document.getElementById('comment-input').value.trim();
    if (!text) return;
    db.collection('videoComments').doc(videoId).collection('comments').add({
      uid: currentUser.uid,
      username:
