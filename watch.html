<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch - SomaliTube</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #f1f1f1; font-family: 'Nunito', Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    #topbar { background: #1a1a1a; border-bottom: 4px solid #ff6a00; min-height: 68px; display: flex; flex-wrap: wrap; align-items: center; padding: 8px 16px; gap: 10px; position: sticky; top: 0; z-index: 100; }
    #logo { font-family: 'Bangers', Impact, fantasy; font-size: 28px; color: #fff; letter-spacing: 2px; text-shadow: 3px 3px 0px #ff6a00; white-space: nowrap; }
    .topbar-btn { height: 34px; padding: 0 14px; font-size: 12px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; border: 2px solid #ff6a00; white-space: nowrap; background: #ff6a00; color: #fff; }
    .topbar-btn.outline { background: transparent; color: #ff6a00; }
    .topbar-btn.outline:hover { background: #ff6a00; color: #fff; }
    #auth-area { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .auth-btn { height: 36px; padding: 0 20px; font-size: 13px; font-weight: 900; display: inline-flex; align-items: center; border: 2px solid #ff6a00; background: #ff6a00; color: #fff; }
    #btn-login { background: transparent; color: #ff6a00; }
    main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 28px 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    #col { flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    #pw { position: relative; background: #000; border: 3px solid #ff6a00; aspect-ratio: 16/9; overflow: hidden; }
    #pw video, #pw iframe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: none; object-fit: contain; background: #000; }
    h1 { font-family: 'Bangers', Impact, fantasy; font-size: 28px; letter-spacing: 1px; line-height: 1.2; overflow-wrap: anywhere; font-weight: normal; }
    .vrow { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding-bottom: 16px; border-bottom: 2px solid #222; }
    .vrow .who { flex: 1 1 160px; min-width: 0; }
    .vrow .nm { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; }
    .vrow .sub { font-size: 12px; color: #666; }
    .sbtn { height: 38px; padding: 0 20px; font: 900 13px 'Nunito', sans-serif; cursor: pointer; border: 2px solid #ff6a00; background: #ff6a00; color: #fff; display: inline-flex; align-items: center; }
    .sbtn:hover { background: #e05a00; }
    .sbtn.on { background: transparent; color: #ff6a00; }
    .ab { height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font: 900 14px 'Nunito', sans-serif; cursor: pointer; background: #1e1e1e; border: 2px solid #333; }
    #lb { color: #2fd16f; } #disb { color: #ff5a5a; }
    #lb.on { border-color: #2fd16f; } #disb.on { border-color: #ff5a5a; }
    .desc { background: #1e1e1e; border: 2px solid #2a2a2a; padding: 14px; }
    .dt { font-size: 13px; line-height: 1.6; color: #aaa; white-space: pre-wrap; overflow-wrap: anywhere; }
    .dclamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .section-label { font-family: 'Bangers', Impact, fantasy; font-size: 22px; color: #ff6a00; letter-spacing: 2px; border-left: 5px solid #ff6a00; padding-left: 12px; line-height: 1.1; margin-bottom: 14px; }
    #side { flex: 0 1 320px; min-width: 260px; display: flex; flex-direction: column; gap: 10px; }
    #side .section-label { margin-bottom: 4px; }
    .nx { display: flex; gap: 10px; background: #1e1e1e; border: 2px solid #2a2a2a; padding: 8px; }
    .nx:hover { border-color: #ff6a00; }
    .nx .th { position: relative; width: 120px; flex-shrink: 0; aspect-ratio: 16/9; background: #2a2a2a; overflow: hidden; }
    .nx .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .nx .t { font-size: 13px; font-weight: 900; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .nx .c { font-size: 11px; font-weight: 700; color: #ff6a00; margin-top: 4px; }
    .nx .m { font-size: 11px; color: #666; }
    #comments .btn { height: 34px; padding: 0 20px; font: 900 13px 'Nunito', sans-serif; cursor: pointer; border: 2px solid #ff6a00; background: #ff6a00; color: #fff; }
    #comments textarea { width: 100%; background: #2a2a2a; border: 2px solid #333; color: #f1f1f1; font: 13px 'Nunito', sans-serif; padding: 10px 12px; outline: none; }
    #comments textarea:focus { border-color: #ff6a00; }
    footer { background: #1a1a1a; border-top: 4px solid #ff6a00; padding: 14px 20px; text-align: center; font-size: 12px; color: #666; }
  </style>
</head>
<body>
<div id="topbar">
  <a href="index.html" id="logo">SOMALITUBE!!!!</a>
  <a href="channels.html" class="topbar-btn outline" style="margin-left:auto">All chanals..</a>
  <div id="upload-btn-wrap"></div>
  <div id="auth-area"><a href="login.html" class="auth-btn" id="btn-login">Log In</a><a href="signup.html" class="auth-btn">Sign Up</a></div>
</div>
<main>
  <div id="col">
    <div id="pw"></div>
    <div id="info" class="sub" style="font-size:13px;color:#666">Loading...</div>
    <div id="comments"></div>
  </div>
  <aside id="side"><div class="section-label">Up next</div><div id="next"></div></aside>
</main>
<footer>&copy; 1972 SomaliTube. No rights reserved. <span style="margin:0 8px;">|</span> Version 1.0</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="st.js"></script>
<script>
  var $ = function(i) { return document.getElementById(i); };
  var cu = null, vid = new URLSearchParams(location.search).get('v'), legacy = !vid, likeId = vid || 'hairy-prey-1';
  var lr = db.collection('videoLikes').doc(likeId).collection('likes'), upUid = null, subRef = null, subCount = 0, subbed = false;

  auth.onAuthStateChanged(function(u) { cu = u; stNav(u); likes(); loadSubs(); });

  function render(v) {
    document.title = v.title + ' - SomaliTube';
    upUid = v.uid;
    if (v.embed) $('pw').innerHTML = '<iframe src="' + v.embed + '" allowfullscreen></iframe>';
    else { var el = document.createElement('video'); el.controls = true; el.playsInline = true; el.poster = v.thumbURL; el.src = v.videoURL; $('pw').appendChild(el); }
    var ds = v.description || '', longD = ds.length > 250 || (ds.match(/\n/g) || []).length > 3;
    $('info').className = ''; $('info').style.cssText = '';
    $('info').innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' +
      '<h1>' + esc(v.title) + '</h1>' +
      '<div class="vrow">' + stAv(v.username, v.uid, 46, 'user.html?uid=' + esc(v.uid)) +
        '<div class="who"><div class="nm"><a href="user.html?uid=' + esc(v.uid) + '">' + esc(v.username) + '</a>' + stSlot(v.uid) + '</div><div class="sub"><span id="subc">...</span> &middot; ' + esc(v.dateText || ('Keeg \u00b7 ' + stDate(v.createdAt))) + '</div></div>' +
        '<button class="sbtn" id="sbtn">Subscreib!</button>' +
        '<button class="ab" id="lb">' + ST_UP + ' <span id="lc">0</span></button><button class="ab" id="disb">' + ST_DN + ' <span id="dc">0</span></button></div>' +
      '<div class="desc"><div id="dtext" class="dt' + (longD ? ' dclamp' : '') + '">' + esc(ds) + '</div>' + (longD ? '<button class="lk" id="dmore" style="margin-top:8px">Read more</button>' : '') + '</div></div>';
    if ($('dmore')) $('dmore').onclick = function() { var t = $('dtext'); t.classList.toggle('dclamp'); this.textContent = t.classList.contains('dclamp') ? 'Read more' : 'Show less'; };
    $('lb').onclick = function() { vote('like'); }; $('disb').onclick = function() { vote('dislike'); };
    $('sbtn').onclick = toggleSub;
    likes(); loadSubs();
    STC.init(likeId, $('comments'));
  }
  if (legacy) render({ title: 'HairyPrey91', description: 'I like it hairy', uid: 'BluFJm8y5cgTyQNRaU4ClJ8OJUK2', username: 'HairyPrey91', dateText: 'Fuckin Keeg \u00b7 22 marsh 2026', embed: 'https://archive.org/embed/somalitube1' });
  else db.collection('videos').doc(vid).get().then(function(d) { if (!d.exists) { $('info').textContent = 'Video not found (maybe deleted).'; return; } render(d.data()); });

  /* likes */
  function likes() {
    if (!$('lc')) return;
    lr.get().then(function(s) { var l = 0, d = 0, m = null; s.forEach(function(x) { x.data().vote === 'like' ? l++ : d++; if (cu && x.id === cu.uid) m = x.data().vote; });
      $('lc').textContent = l; $('dc').textContent = d; $('lb').className = 'ab' + (m === 'like' ? ' on' : ''); $('disb').className = 'ab' + (m === 'dislike' ? ' on' : ''); });
  }
  function vote(t) { if (!cu) return location.href = 'login.html'; var r = lr.doc(cu.uid); r.get().then(function(d) { (d.exists && d.data().vote === t ? r.delete() : r.set({ vote: t })).then(likes); }); }

  /* subscribe to the uploader (same data as the channel page) */
  function loadSubs() {
    if (!upUid || !$('sbtn')) return;
    db.collection('users').doc(upUid).collection('subscribers').get().then(function(s) {
      subCount = s.size; subbed = false; s.forEach(function(x) { if (cu && x.id === cu.uid) subbed = true; });
      $('subc').textContent = subCount + ' subscriber' + (subCount !== 1 ? 's' : '');
      $('sbtn').textContent = subbed ? 'Subcreibed!' : 'Subscreib!'; $('sbtn').className = 'sbtn' + (subbed ? ' on' : '');
    });
  }
  function toggleSub() {
    if (!cu) return location.href = 'login.html';
    var ref = db.collection('users').doc(upUid).collection('subscribers').doc(cu.uid);
    (subbed ? ref.delete() : ref.set({ uid: cu.uid })).then(function() { try { sessionStorage.removeItem('stb2'); } catch (e) {} loadSubs(); });
  }

  /* up next */
  db.collection('videos').orderBy('createdAt', 'desc').limit(9).get().then(function(s) {
    var h = '';
    s.forEach(function(d) { if (d.id === vid) return; var v = d.data();
      h += '<a href="watch.html?v=' + d.id + '" class="nx"><div class="th"><img src="' + esc(v.thumbURL) + '" alt=""></div><div style="min-width:0"><div class="t">' + esc(v.title) + '</div><div class="c">' + esc(v.username) + '</div><div class="m">' + stDate(v.createdAt) + '</div></div></a>'; });
    $('next').innerHTML = h || '<div class="sub" style="font-size:12px;color:#666">Nothing else yet.</div>';
  });
</script>
</body>
</html>
